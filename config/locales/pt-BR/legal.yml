      draft_title: "Minuta — documento em elaboração"
      draft_notice: "Este texto apresenta o funcionamento atual do projeto. O responsável e o contato estão informados abaixo. A avaliação das bases legais e das medidas para menores, a hospedagem e os prazos de retenção ainda precisam ser concluídos e validados. Esta minuta não declara que a adequação à LGPD está concluída."

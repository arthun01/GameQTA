      contact_name: "Guilhardes de Jesus Júnior"
      contact_email: "guilhardesj@gmail.com"
    terms:
      title: "Termos de Uso"
      subtitle: "Conheça a proposta do jogo e as regras de participação."
      summary: "O Game QTA é um projeto educacional sobre Direito Ambiental, com vídeos, questões e uma jornada de aprendizado. Estes termos estão em elaboração e devem ser lidos junto com a Política de Privacidade. A leitura desta página não registra aceite nem autoriza tratamentos opcionais de dados."
      sections:
        project:
          title: "1. Sobre o Game QTA"
          paragraphs:
            - "O projeto busca apoiar o aprendizado por meio de níveis, temas, perguntas e explicações. Os conteúdos têm finalidade educacional e não substituem orientação jurídica sobre um caso concreto."
            - "Guilhardes de Jesus Júnior foi informado como responsável pelo Game QTA e pelo atendimento de privacidade, com apoio da equipe do projeto. A operação descrita nesta minuta não é formalmente atribuída à UESC. Referências institucionais não substituem a identificação de quem efetivamente decide sobre o uso dos dados."
        participation:
          title: "2. Cadastro e participação"
          paragraphs:
            - "O cadastro é aberto ao público e solicita nome, e-mail, senha e idade. Cidade e escolaridade são opcionais e ajudam a conhecer o público do projeto. Use informações corretas e uma conta que você possa administrar com segurança. Não use a identidade de outra pessoa."
            - "O cadastro segue o mesmo fluxo para as idades aceitas pelo jogo: não existe uma etapa de aprovação externa. As proteções de privacidade descritas nesta minuta são aplicadas a todos. A idade informada é declarada pelo participante; o cadastro e o aceite não comprovam autorização de um responsável legal. A avaliação jurídica dos tratamentos de dados de crianças e adolescentes e das medidas de supervisão aplicáveis ainda precisa ser concluída."
        rules:
          title: "3. Regras de participação"
          items:
            - "Respeite a finalidade educacional do jogo e as demais pessoas participantes."
            - "Não tente manipular respostas, pontuações, tempos ou mecanismos de acesso."
            - "Não tente acessar contas, relatórios ou informações que não pertençam a você ou às suas atribuições."
            - "Não utilize falhas do sistema para prejudicar o projeto ou expor dados de terceiros."
          paragraphs:
            - "A administração pode bloquear contas por infrações às regras. O bloqueio encerra as sessões do estudante e retira sua participação do ranking. Esclarecimentos e contestações podem ser enviados ao contato informado abaixo; a equipe deverá analisar o pedido e explicar sua decisão."
        account:
          title: "4. Segurança da conta"
          paragraphs:
            - "Mantenha sua senha em sigilo, evite reutilizá-la em outros serviços e encerre sua sessão ao usar um dispositivo compartilhado. A equipe não deve solicitar que você informe sua senha para atender um pedido."
            - "As áreas de estudantes e de administração utilizam acessos separados. A existência de uma conta de estudante não concede acesso aos dados administrativos."
        learning:
          title: "5. Jornada, desempenho e ranking"
          paragraphs:
            - "O jogo registra tentativas, respostas e informações de desempenho para organizar a jornada e calcular resultados. A dificuldade das questões influencia a pontuação; o tempo registrado participa dos critérios do ranking."
            - "Antes de revelar cada questão, qualquer participante pode escolher de 1 a 10 vezes o tempo padrão, sem informar diagnóstico. Os pontos não mudam; o tempo efetivo continua sendo usado no desempate. Por isso o ranking é uma classificação lúdica e não uma comparação padronizada de capacidade entre pessoas. Outros estudantes autenticados visualizam códigos de jogador gerados automaticamente, pontuações e tempos no ranking. O ranking não apresenta o nome de cadastro ou o e-mail. O código reduz a exposição, mas a administração ainda pode relacioná-lo à conta; não representa anonimização completa."
        external_content:
          title: "6. Conteúdo e serviços externos"
          paragraphs:
            - "Os vídeos do YouTube começam desligados. Você escolhe carregar apenas o vídeo da página ou continuar sem ele. Ao carregá-lo, o navegador se conecta ao Google/YouTube, que recebe dados de conexão e pode usar armazenamento próprio. É possível desativar o player a qualquer momento nessa página; isso não apaga dados já recebidos pelo fornecedor. Não usamos fontes remotas do Google: a tipografia vem do seu dispositivo."
            - "Disponibilidade, anúncios, acessibilidade e conteúdo dos serviços externos podem mudar. A equipe precisa avaliar alternativas e medidas de proteção antes da versão definitiva destes documentos."
        closing:
          title: "7. Encerramento e direitos"
          paragraphs:
            - "Você pode parar de utilizar o jogo. Sair da sessão ou deixar de jogar não equivale a excluir os dados da conta. O procedimento de solicitação de exclusão está descrito, com suas pendências atuais, na Política de Privacidade."
            - "Estes termos não afastam direitos garantidos pela legislação. Pedidos e esclarecimentos podem ser enviados ao contato de privacidade informado abaixo, inclusive por responsáveis ou por quem perdeu acesso à conta. Esta página apenas fornece o contato; não envia mensagens nem gera protocolo."
        changes:
          title: "8. Alterações e versão deste documento"
          paragraphs:
            - "A versão e a data acima permitem identificar esta minuta. Textos e funcionalidades poderão ser ajustados durante sua revisão. Mudanças relevantes precisarão ser comunicadas aos participantes antes da adoção definitiva."
            - "O cadastro registra o aceite dos termos e a ciência da política, com data, versões e cópia dos textos apresentados. Contas existentes precisam registrar sua manifestação para retomar o jogo quando houver documentos atualizados. Essa manifestação não equivale a consentimento geral de tratamento nem a autorização de responsável por menor. A navegação nesta página não registra concordância automática."
    privacy:
      title: "Política de Privacidade"
      subtitle: "Entenda quais dados aparecem no jogo, para que são usados e quais direitos você tem."
      summary: "Esta minuta descreve o uso atual de dados de estudantes e administradores no Game QTA. Ela também aponta decisões ainda pendentes. Não há, nesta página, formulário de atendimento ou registro de consentimento."
      sections:
        responsibility:
          title: "1. Quem responde pelos dados"
          paragraphs:
            - "O responsável informado pelo Game QTA é Guilhardes de Jesus Júnior. O contato para privacidade é guilhardesj@gmail.com, disponível também a representantes legais e a pessoas sem acesso à conta."
            - "A operação desta aplicação foi informada como responsabilidade do professor e da equipe, sem papel formal da UESC. Uma eventual pesquisa institucional será avaliada separadamente. A identificação dos papéis considera quem decide e executa cada tratamento de dados."
        supplied_data:
          title: "2. Dados que você fornece"
          items:
            - "Estudantes: nome, e-mail, idade e senha para criação e acesso à conta. Cidade e escolaridade são opcionais e podem ser removidas no perfil."
            - "Administradores: e-mail e senha para acesso à gestão do conteúdo e da comunidade."
          paragraphs:
            - "A aplicação armazena uma representação protegida da senha, e não a senha em texto aberto. Os demais dados de cadastro são usados para identificar a conta e compor informações sobre o público participante. Nome e e-mail identificam a conta; a senha protegida permite autenticação. Idade, cidade e escolaridade estão preservadas no cadastro. Cidade e escolaridade continuam opcionais. A necessidade da identificação completa e dos dados demográficos será avaliada por finalidade; o possível uso científico futuro não autoriza, por si só, sua coleta ou guarda indefinida."
        generated_data:
          title: "3. Dados gerados durante o uso"
          items:
            - "Tentativas de temas, questões respondidas, alternativas escolhidas, acertos e erros."
            - "Momentos de revelação e envio de respostas, informações de tempo quando registradas, pontuação e posição no ranking."
            - "Dados de sessão, endereço IP e informações do navegador no login."
            - "Datas dos registros, situação de bloqueio da conta, histórico de aceite dos documentos e registros operacionais de acesso e de erros."
          paragraphs:
            - "Esses registros apoiam o funcionamento da jornada, a apresentação de resultados, a autenticação, a segurança e a manutenção do serviço. A política de retenção e a avaliação de necessidade dos registros ainda estão pendentes."
        purposes:
          title: "4. Finalidades e bases legais"
          paragraphs:
            - "O uso atual dos dados abrange funcionamento das contas, atividades educacionais, acompanhamento do desempenho, ranking, moderação e relatórios administrativos. A hipótese de legítimo interesse está em avaliação para os tratamentos necessários ao serviço educativo e à segurança, com análise específica dos direitos de crianças e adolescentes. A opção por cadastro direto não confirma, por si só, a adequação dessa base a todos os dados. Finalidades e bases precisam de validação antes da adoção definitiva desta política."
            - "A ciência da política, o aceite dos termos e um consentimento específico têm funções diferentes. A leitura desta página ou o uso do jogo não representam autorização geral para todas as formas de tratamento de dados. Não existe autorização automática para pesquisas futuras: cada estudo ou banco de pesquisa deverá ter finalidade, base legal, governança e requisitos éticos próprios, quando aplicáveis."
        access:
          title: "5. Quem pode visualizar os dados"
          paragraphs:
            - "Administradores autenticados têm acesso a dados de estudantes e relatórios. As exportações de estudantes podem conter nome, e-mail, cidade, escolaridade, pontuação, tempo, situação de bloqueio e data de cadastro. Os relatórios por tema apresentam resultados agregados."
            - "O ranking mostra a outros estudantes autenticados um código de jogador, pontuação e tempo efetivo. O limite de resposta pode ser ajustado antes da revelação por qualquer participante; a pontuação por acerto permanece igual. Nome, e-mail, idade, cidade e escolaridade não são exibidos nessa classificação. A equipe administrativa mantém acesso aos dados necessários às suas atribuições, e relatórios identificáveis exigem cuidado adicional de acesso, guarda e descarte."
            - "Cópias de relatórios baixadas por administradores também precisam de regras de acesso, guarda e descarte. A exclusão na aplicação não apaga automaticamente essas cópias."
        cookies:
          title: "6. Cookies e serviços externos"
          paragraphs:
            - "O cookie próprio _qta_rails8_session mantém a navegação e a proteção dos formulários, com validade de até 12 horas após uso. Os cookies user_session_id (estudante) e session_id (administração) guardam identificadores assinados: o acesso expira 12 horas após o login também no servidor. Não guardam a senha. São HttpOnly e SameSite=Lax; em produção usam Secure e HTTPS. Sair da conta invalida a respectiva sessão no servidor. Apagar só o cookie não exclui o cadastro nem os registros da sessão no banco."
            - "Não instalamos analytics, pixels comerciais ou fontes externas. Os vídeos são opcionais, sem conexão automática ou autorização salva: Carregar este vídeo ativa somente o player da página em youtube-nocookie.com; Continuar sem vídeo mantém o bloqueio. Desativar vídeo externo interrompe novas conexões daquele player, sem desfazer dados já enviados. Recarregar, navegar ou revelar a questão exige nova escolha. O domínio de privacidade avançada não significa ausência de tratamento ou armazenamento pelo Google; aplicam-se as políticas do fornecedor. A escolha do player não equivale a autorização parental ou consentimento de pesquisa."
            - "A definição de hospedagem, fornecedores, locais de tratamento e eventuais transferências internacionais está pendente. Esta política será complementada com essas informações antes da publicação definitiva."
        children:
          title: "7. Crianças e adolescentes"
          paragraphs:
            - "O cadastro é aberto ao público, inclusive para as idades aceitas no formulário, e pode alcançar crianças menores de 12 anos. Não há aprovação externa no fluxo atual. A avaliação de necessidade, base legal e medidas de apoio aos responsáveis permanece pendente; não declaramos dispensa geral das obrigações de proteção de menores. A classificação usa códigos em vez dos nomes para todos os participantes."
            - "Responsáveis podem conhecer os dados usados e os direitos nesta página e solicitar esclarecimentos, correção ou exclusão pelo contato informado. A equipe deverá verificar proporcionalmente a identidade e a representação antes de fornecer dados ou agir sobre uma conta. O aceite do estudante não será tratado como autorização parental ou consentimento de pesquisa."
        retention:
          title: "8. Guarda e exclusão dos dados"
          paragraphs:
            - "Ainda não foram definidos os prazos de guarda de contas, dados de jogo, registros operacionais e backups. Não há nesta minuta um prazo fictício ou promessa de exclusão automática de contas inativas."
            - "O estudante autenticado pode excluir sua conta no perfil, confirmando a senha atual e as consequências da ação. A exclusão remove o cadastro, todas as sessões, tentativas, respostas, ranking e registros de aceite da aplicação ativa. A atualização pendente do ranking não restaura uma conta excluída. O contato para pedidos está disponível abaixo. Os prazos e procedimentos de tratamento de registros operacionais, backups e cópias exportadas continuam pendentes, observadas as hipóteses legais de conservação."
            - "Sair da conta, interromper o uso ou apagar cookies do navegador não exclui os registros já armazenados pelo projeto."
        rights:
          title: "9. Seus direitos sobre os dados"
          paragraphs:
            - "A LGPD prevê direitos que podem ser exercidos pelo titular ou por seu representante legal, conforme as condições aplicáveis a cada tratamento."
          items:
            - "Confirmar o tratamento e acessar seus dados; corrigir informações incompletas, inexatas ou desatualizadas."
            - "Pedir anonimização, bloqueio ou eliminação de dados desnecessários, excessivos ou tratados em desacordo com a lei."
            - "Solicitar portabilidade nos limites da regulamentação e eliminação de dados tratados com consentimento, ressalvadas as hipóteses legais de conservação."
            - "Conhecer os compartilhamentos, a possibilidade de recusar consentimento e as consequências dessa escolha; revogar o consentimento quando ele for a base utilizada."
            - "Opor-se ao tratamento em caso de descumprimento da LGPD e solicitar revisão e explicação de decisões exclusivamente automatizadas que afetem seus interesses, quando cabível."
            - "Apresentar petição à ANPD e recorrer aos órgãos competentes nas hipóteses legais."
        requests:
          title: "10. Como solicitar correção ou exclusão"
          paragraphs:
            - "Para corrigir dados de cadastro ou excluir a conta da aplicação ativa, entre no jogo e acesse Meu perfil e meus dados. As ações pedem sua senha atual; a exclusão exige confirmação adicional e não pode ser desfeita. Esses recursos continuam disponíveis mesmo sem aceitar documentos atualizados. Quem perdeu acesso à conta, representantes legais e outros pedidos podem usar guilhardesj@gmail.com. Esta página não recebe mensagens nem gera protocolo; o pedido é encaminhado pelo seu serviço de e-mail."
            - "No e-mail, identifique a conta, informe o direito que deseja exercer e descreva a solicitação. Se atuar como representante, informe essa condição sem anexar documentos sensíveis desnecessariamente. A equipe deverá verificar identidade e representação de forma proporcional, confirmar o recebimento e responder nos prazos legais aplicáveis, justificando eventual impossibilidade. Pedidos e contestações sobre dados ou proteção de menores devem ser direcionados ao mesmo contato."
            - "Não envie sua senha ou documentos pessoais sem necessidade. Para conhecer os direitos e os canais da autoridade, consulte as orientações oficiais da ANPD abaixo."
        updates:
          title: "11. Atualizações e referências"
          paragraphs:
            - "A versão e a data identificam esta minuta. As definições pendentes e as mudanças no funcionamento do jogo deverão ser refletidas nas próximas versões, com comunicação adequada das alterações relevantes."
          links:
            - label: "LGPD — Lei nº 13.709/2018"
              url: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709compilado.htm"
            - label: "ANPD — Direitos dos titulares"
              url: "https://www.gov.br/anpd/pt-br/assuntos/titular-de-dados/direito-dos-titulares"
            - label: "ANPD — Proteção de crianças e adolescentes no ambiente digital"
              url: "https://www.gov.br/anpd/pt-br/assuntos/eca-digital"

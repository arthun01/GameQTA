    time_help: "Escolha até 10 vezes o tempo antes de mostrar a questão. Disponível a todos. Os pontos são os mesmos; o tempo efetivo continua no desempate do ranking."
    time_remaining: "Tempo restante para responder"
    time_warning: "Restam 20 segundos ou menos para confirmar sua resposta."
    choose_answer: "Escolha uma alternativa e confirme"
    confirm_answer: "Confirmar resposta"
